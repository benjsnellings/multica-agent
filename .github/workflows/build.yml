name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild picks up Debian base-image security updates and the
    # latest Multica / Claude / Node / Pi releases (resolved at build time).
    # The in-container tool-updater also refreshes Claude / Cursor / Pi at runtime.
    - cron: '0 7 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/multica-agent

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: multica-agent:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test bundled CLIs
        run: |
          docker run --rm --entrypoint /bin/bash multica-agent:smoke-test -c '
            set -e
            echo "=== multica ==="       && multica version
            echo "=== claude ==="        && claude --version
            echo "=== cursor-agent ===" && cursor-agent --version
            echo "=== pi ==="            && pi --version
            echo "=== node ==="          && node --version
          '

      - name: Verify entrypoint fails closed without credentials
        run: |
          set +e
          timeout 120 docker run --rm -e MULTICA_TOKEN= multica-agent:smoke-test >/tmp/out 2>&1
          rc=$?
          set -e
          cat /tmp/out
          if [ "$rc" -ne 78 ]; then
            echo "expected EX_CONFIG (78) with no credentials, got ${rc}" >&2
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
