name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild. Nothing is version-pinned, so this re-resolves the latest
    # Node / Multica / Claude / Cursor / Pi and refreshes the Debian base layer.
    - cron: '0 7 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/multica-agent

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve cache-busting refresh key
        id: refresh
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: multica-agent:candidate
          build-args: |
            REFRESH=${{ steps.refresh.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report resolved versions
        run: |
          docker run --rm --entrypoint /bin/cat multica-agent:candidate \
            /etc/multica-agent-versions | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test bundled CLIs
        run: |
          docker run --rm --entrypoint /bin/bash multica-agent:candidate -c '
            set -e
            echo "=== multica ==="       && multica version
            echo "=== claude ==="        && claude --version
            echo "=== cursor-agent ===" && cursor-agent --version
            echo "=== pi ==="            && pi --version
            echo "=== node ==="          && node --version
          '

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      - name: Push tested image to GHCR
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "=== $tag ==="
            docker tag multica-agent:candidate "$tag"
            docker push "$tag"
          done <<< "$TAGS"